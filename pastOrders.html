<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سفارشات قبلی</title>

    <!-- Local vendor CSS (place compiled Tailwind at assets/tailwind.min.css) -->
    <link rel="stylesheet" href="assets/tailwind.min.css" />
    <!-- Local font css (create assets/fonts.css + place font files under assets/fonts/) -->
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="stylesheet" href="./main.css" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">


    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              vazir: ["Vazirmatn", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "Vazirmatn", sans-serif;
        background-color: #f3f4f6;
      }
    </style>
  </head>

  <body class="mx-auto py-6 px-4">
    <!-- PWA: install + update at top, scroll with page -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <button id="installBtn" class="hidden bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700">نصب اپ</button>
      <div id="updateBanner" class="hidden flex-1 min-w-0 flex items-center justify-between gap-3 px-4 py-3 rounded-lg border-2 border-amber-600 shadow-md" style="background-color: #d97706; color: #fff;">
        <span class="font-medium">نسخه جدید آماده است.</span>
        <button id="updateReloadBtn" type="button" class="bg-white text-amber-800 px-3 py-1.5 rounded font-medium hover:bg-amber-50 shrink-0">بروزرسانی</button>
      </div>
    </div>
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold">📜 سفارشات قبلی</h1>
      <span data-app-version class="block text-sm text-gray-500 mt-2" aria-label="نسخه برنامه"></span>
    </header>

    <div class="flex flex-col items-center gap-3 mb-6">
      <a
        href="order.html"
        class="w-64 max-w-full text-center bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition"
      >
        ← بازگشت به صفحه سفارش
      </a>
      <button
        id="printDaySummaryBtn"
        type="button"
        class="w-56 max-w-full bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition"
      >
        🖨️ پرینت خلاصه روز
      </button>
    </div>

    <!-- Container for past orders (direction: ltr so first child = newest is at top) -->
    <div id="pastOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4" style="direction: ltr;"></div>

    <!-- Template if no orders -->
    <div id="noOrders" class="text-center text-gray-500 hidden">
      هیچ سفارشی در حافظه ذخیره نشده است.
    </div>

    <!-- External JS -->
    <script src="app-version.js?v=1"></script>
    <script src="businessDay.js?v=3"></script>
    <script src="pastOrders.js?v=3"></script>
  </body>
</html>
