<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سیستم ثبت سفارش</title>

    <!-- Local vendor CSS (single merged file) -->
    <link rel="stylesheet" href="assets/tailwind.min.css" />
    <!-- Local font css (create assets/fonts.css + place font files under assets/fonts/) -->
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="stylesheet" href="./main.css" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">


    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              vazir: ["Vazirmatn", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "Vazirmatn", sans-serif;
        background-color: #f3f4f6;
      }

      .menu-section {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background-color: #fff;
        border-radius: 0.5rem;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        padding: 1rem;
        margin-bottom: 1rem;
      }

      .foods,
      .toppings {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      label {
        background-color: #f9fafb;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      label:hover {
        background-color: #e5e7eb;
      }

      .price {
        font-size: 0.875rem;
        color: #4b5563;
      }
    </style>
  </head>

  <body class="max-w-5xl mx-auto py-6 px-4">
    <!-- PWA: install + update at top, scroll with page -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <button id="installBtn" class="hidden bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700">نصب اپ</button>
      <div id="updateBanner" class="hidden flex-1 min-w-0 flex items-center justify-between gap-3 px-4 py-3 rounded-lg border-2 border-amber-600 shadow-md" style="background-color: #d97706; color: #fff;">
        <span class="font-medium">نسخه جدید آماده است.</span>
        <button id="updateReloadBtn" type="button" class="bg-black text-amber-800 px-3 py-1.5 rounded font-medium hover:bg-amber-50 shrink-0">بروزرسانی</button>
      </div>
    </div>
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-blue-700 mb-2">
        🍽️ سیستم ثبت سفارش غذا
      </h1>
      <p class="text-gray-700 text-lg">
        لطفاً غذا و تاپینگ‌های مورد نظر خود را انتخاب کنید.
      </p>
      <span data-app-version class="block text-sm text-gray-500 mt-2" aria-label="نسخه برنامه"></span>
      <div class="flex justify-center mt-4">
      <a
        href="pastOrders.html"
        class="bg-gray-600 text-white px-6 py-2 rounded-lg hover:bg-gray-700 transition"
      >
        📜 مشاهده سفارشات قبلی
      </a>
    </div>
    </header>

    <!-- Order Number -->
    <div
      class="text-center text-lg mb-6 bg-white shadow-sm py-3 rounded-md font-semibold"
    >
      شماره سفارش:
      <span id="orderNumber" class="font-bold text-blue-600">1</span>
    </div>

    <!-- Menu Container -->
    <div id="menuContainer" class="flex flex-col gap-4"></div>

    <!-- Submit Food Button -->
    <div class="flex justify-center mt-6">
      <button
        id="submitFood"
        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition"
      >
        افزودن غذا به فاکتور
      </button>
    </div>

    <!-- Order Summary -->
    <div
      id="orderSummary"
      class="bg-white rounded-lg shadow-md mt-8 p-4 max-w-md mx-auto"
    >
      <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">
        🧾 فاکتور سفارش
      </h2>
      <ul id="orderList" class="space-y-2"></ul>

      <!-- Total section -->
      <div
        id="totalSection"
        class="text-right font-bold text-lg text-blue-700 mt-4 border-t pt-2 hidden"
      >
        جمع کل فاکتور: ۰ تومان
      </div>
    </div>

    <!-- Submit Whole Order -->
    <div class="flex justify-center mt-6">
      <button
        id="submitOrder"
        class="bg-green-600 text-white px-8 py-2 rounded-lg hover:bg-green-700 transition"
      >
        ثبت کل سفارش ✅
      </button>
    </div>
    

    <script src="app-version.js?v=1"></script>
    <script src="businessDay.js?v=3"></script>
    <script src="order.js?v=3"></script>
  </body>
</html>
